name: Build Maru Ghar Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: maru-ghar-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Arrange assets uploaded at repository root
        run: |
          set -eu
          mkdir -p assets
          for f in icon.png maru-ghar-approved-app-icon.png maru-ghar-backend.js maru-ghar-logo.svg splash.png; do
            if [ -s "$f" ]; then cp -f "$f" "assets/$f"; fi
          done

      - name: Check project files and JavaScript syntax
        run: |
          set -eu
          test -s index.html
          test -s admin.html
          test -s firebase-config.js
          test -s firestore.rules
          test -s firestore.indexes.json
          test -s package.json
          test -s assets/maru-ghar-logo.svg
          test -s assets/maru-ghar-logo-3d.png
          test -s assets/maru-ghar-backend.js
          test -s assets/icon.png
          test -s assets/maru-ghar-approved-app-icon.png
          test -s assets/splash.png
          test -s assets/maru-ghar-extras.js
          test -s privacy.html
          test -s download.html
          test -s assets/maru-ghar-qr.js
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>([\s\S]*?)<\/script>/);if(!m)process.exit(1);new Function(m[1]);"
          node --input-type=module --check < assets/maru-ghar-backend.js
          node --check assets/maru-ghar-extras.js
          node --check assets/maru-ghar-qr.js
          node --input-type=module --check < firebase-config.js
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'))"
          node -e "const fs=require('fs');const h=fs.readFileSync('admin.html','utf8');const m=h.match(/<script type=\"module\">([\s\S]*?)<\/script>/);if(!m)process.exit(1);fs.writeFileSync('/tmp/admin-module-check.mjs',m[1]);"
          node --check /tmp/admin-module-check.mjs

      - name: Install dependencies and prepare website files
        run: |
          npm install --no-audit --no-fund
          npm run copy-web

      - name: Generate Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Set app version (must increase on every build so updates install over old versions)
        run: |
          cd android/app
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" build.gradle
          grep -q "versionCode ${{ github.run_number }}" build.gradle || { echo "::error::versionCode could not be set"; exit 1; }

      - name: Check signing secrets
        env:
          KS_B64: ${{ secrets.MARU_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MARU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARU_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::GitHub Secrets missing: MARU_KEYSTORE_BASE64, MARU_KEYSTORE_PASSWORD, MARU_KEY_ALIAS. A fixed signing key is required so users can update the app without uninstalling."
            exit 1
          fi

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign APK with the permanent Maru Ghar key
        env:
          KS_B64: ${{ secrets.MARU_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MARU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARU_KEY_ALIAS }}
        run: |
          set -eu
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/maru.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/maru.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS --out MARU-GHAR.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/apksigner" verify --print-certs MARU-GHAR.apk
          rm -f "$RUNNER_TEMP/maru.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MARU-GHAR-ANDROID-APK
          path: MARU-GHAR.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases (permanent public download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" MARU-GHAR.apk --title "Maru Ghar 1.${{ github.run_number }}" --notes "Maru Ghar Android APK" --latest

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MARU-GHAR-BUILD-DIAGNOSTICS
          path: |
            android/**/*.log
            android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
