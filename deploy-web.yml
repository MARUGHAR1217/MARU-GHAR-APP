name: Deploy Maru Ghar Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin.html'
      - 'privacy.html'
      - 'download.html'
      - 'firebase-config.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: maru-ghar-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare website files
        run: |
          set -eu
          mkdir -p _site/assets
          cp index.html admin.html privacy.html download.html firebase-config.js manifest.webmanifest _site/
          cp -R assets/. _site/assets/
          test -s _site/index.html
          test -s _site/admin.html
          test -s _site/firebase-config.js
          test -s _site/assets/maru-ghar-backend.js
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
